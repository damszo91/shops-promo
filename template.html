<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shops Promo</title>
<meta name="theme-color" content="#14110f">
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #14110f; --muted: #7a726a; --line: #e6e0d7;
    --hot: #e2402d; --hot-soft: #fde7e3; --ok: #1f7a4d; --ok-soft: #e1f2e8; --warn: #9a6400; --warn-soft: #fbefd6;
    --r: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14110f; --card:#1f1b18; --ink:#f3eee8; --muted:#a59c92; --line:#332d28;
            --hot-soft:#3a1d18; --ok-soft:#173226; --warn-soft:#3a2c10; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent);
           backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: 10px 14px; }
  .top { display:flex; align-items:center; gap:12px; }
  h1 { margin:0; font-size: 21px; letter-spacing:-.02em; white-space:nowrap; }
  h1 span { color: var(--hot); }
  .meta { color: var(--muted); font-size: 12px; text-align:right; white-space:nowrap; }
  .burger { border:1px solid var(--line); background: var(--card); color: inherit; border-radius: 10px; width:40px; height:40px; font-size:20px; cursor:pointer; flex:0 0 auto; }
  input[type=search], select, input[type=number] {
    font: inherit; color: inherit; background: var(--card); border:1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width:0;
  }
  #q { flex: 1; }
  .q-mob { display:flex; margin-top:10px; }
  .shop { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  /* menu boczne */
  .layout { display:flex; align-items:flex-start; }
  nav#side { width: 260px; flex: 0 0 260px; padding: 14px 12px 40px; background: var(--bg); }
  .sec { font-size: 12px; font-weight: 700; letter-spacing:.04em; text-transform: uppercase; color: var(--muted); margin: 16px 8px 6px; }
  .sec:first-child { margin-top: 0; }
  .it { display:flex; align-items:center; gap:6px; width:100%; text-align:left; border:0; background:transparent; color: inherit;
        font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; cursor:pointer; }
  .it:hover { background: var(--card); }
  .it .n { margin-left:auto; color: var(--muted); font-size: 12px; }
  .it.sub { padding-left: 32px; }
  .it[aria-pressed=true] { background: var(--ink); color: var(--bg); }
  .it[aria-pressed=true] .n { color: inherit; opacity: .75; }
  .it.parent[aria-pressed=true] { background: var(--card); color: inherit; font-weight: 600; }
  .it.parent[aria-pressed=true] .n { color: var(--muted); opacity: 1; }
  #shops .it[aria-pressed=true] { background: var(--hot); color: #fff; }
  .it.toggle { color: var(--muted); font-size: 13px; }
  .filters { display:grid; gap:12px; padding: 4px 8px; }
  .filters label { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:14px; }
  .filters input[type=range] { flex:1; accent-color: var(--hot); }
  .range { display:flex; align-items:center; gap:6px; }
  .filters input[type=number] { width: 72px; }
  .shade { display:none; }
  main { flex: 1; min-width: 0; padding: 14px; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin: 0 2px 12px; }
  .crumb { font-size: 15px; font-weight: 600; margin-right:auto; }
  .crumb .count { font-weight: 400; color: var(--muted); font-size: 13px; }
  .seg { display:flex; align-items:center; gap:6px; font-size:13px; color: var(--muted); }
  .seg button { font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line);
                background: var(--card); color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .note { color: var(--muted); font-size: 12px; margin: -4px 2px 10px; }
  .note:empty { display:none; }
  .link { border:0; background:none; padding:0; font:inherit; color: var(--hot); text-decoration: underline; cursor:pointer; }
  /* komputer: menu stale po lewej */
  @media (min-width: 900px) {
    .burger, .q-mob, .side-meta { display:none; }
    nav#side { position: sticky; top: 61px; max-height: calc(100vh - 61px); overflow-y: auto; border-right: 1px solid var(--line); }
    main { padding: 16px 22px; }
  }
  @media (max-width: 899px) {
    .meta { display:none; }
    nav#side { position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: 84vw; max-width: 320px; overflow-y: auto;
               transform: translateX(-100%); transition: transform .25s; border-right: 1px solid var(--line); }
    body.menu nav#side { transform: none; }
    body.menu .shade { display:block; position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); }
    body.menu { overflow: hidden; }
    .side-head { display:flex !important; }
  }
  .side-head { display:none; align-items:center; justify-content:space-between; margin: 0 4px 10px; }
  .side-head b { font-size: 17px; }
  .side-head button { border:0; background:transparent; color:inherit; font-size:22px; cursor:pointer; }
  .side-meta { color: var(--muted); font-size: 12px; margin: 0 8px 4px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { background: var(--card); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); display:flex; flex-direction:column; position:relative; }
  .card a.img { display:block; aspect-ratio: 3/4; background: var(--line); position:relative; }
  .card img { width:100%; height:100%; object-fit:cover; display:block; }
  .off { position:absolute; left:8px; top:8px; background: var(--hot); color:#fff; font-weight:800; font-size:15px; padding:3px 8px; border-radius: 8px; letter-spacing:-.02em; }
  .fav { position:absolute; right:6px; top:6px; width:34px; height:34px; border-radius:50%; border:0; background: rgba(255,255,255,.9); font-size:17px; cursor:pointer; line-height:34px; color:#14110f; }
  .fav[aria-pressed=true] { color: var(--hot); }
  .body { padding: 9px 10px 11px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .name { font-size: 13px; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color: inherit; text-decoration:none; }
  .prices { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; }
  .now { font-weight: 800; font-size: 18px; color: var(--hot); letter-spacing:-.02em; }
  .was { color: var(--muted); text-decoration: line-through; font-size: 13px; }
  .low30 { font-size: 11px; color: var(--warn); }
  .sizes { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:auto; padding-top:4px; }
  .tag { font-size: 11px; font-weight:600; padding: 2px 7px; border-radius: 6px; }
  .t-new { background: var(--ok-soft); color: var(--ok); }
  .t-drop { background: var(--hot-soft); color: var(--hot); }
  .t-warn { background: var(--warn-soft); color: var(--warn); }
  .t-code { background: #e7e3ff; color: #3a2aa8; }
  @media (prefers-color-scheme: dark) { .t-code { background: #27214d; color: #b9adff; } }
  .t-best { background: #ffe9cc; color: #a34700; }
  @media (prefers-color-scheme: dark) { .t-best { background: #3d2610; color: #ffb366; } }
  .empty { text-align:center; color: var(--muted); padding: 60px 20px; }
  .more { display:block; margin: 18px auto; padding: 11px 22px; border-radius: 999px; border:1px solid var(--line); background: var(--card); color: inherit; font: inherit; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="burger" id="burger" aria-label="Menu">☰</button>
    <h1>Shops <span>Promo</span></h1>
    <input type="search" id="q" class="q-desk" placeholder="Szukaj…" autocomplete="off">
    <div class="meta" id="meta"></div>
  </div>
  <div class="q-mob" id="qMobBox"></div>
</header>
<div class="shade" id="shade"></div>
<div class="layout">
  <nav id="side" aria-label="Menu">
    <div class="side-head"><b>Menu</b><button id="closeMenu" aria-label="Zamknij">✕</button></div>
    <div class="side-meta" id="sideMeta"></div>
    <div class="sec">Rodzaj</div>
    <div id="kinds"></div>
    <div class="sec">Dla kogo</div>
    <div id="sexes"></div>
    <div id="bestBox" style="margin-top:8px"></div>
    <div class="sec">Sklep</div>
    <div id="shops"></div>
    <div class="sec">Filtry</div>
    <div class="filters">
      <label>Rabat <input type="range" id="minOff" min="10" max="80" step="5" value="10"> <b id="minOffV">10%</b></label>
      <label>Cena <span class="range"><input type="number" id="minPrice" min="0" step="5" placeholder="od zł" aria-label="Cena od"> – <input type="number" id="maxPrice" min="0" step="5" placeholder="do zł" aria-label="Cena do"></span></label>
      <label>Rozmiar <select id="size"><option value="">wszystkie</option></select></label>
    </div>
  </nav>
  <main>
    <div class="bar">
      <div class="crumb"><span id="crumb">Wszystko</span> <span class="count" id="count"></span></div>
      <div class="seg" id="base" role="group" aria-label="Od jakiej ceny liczyć rabat">
        <span>Rabat od:</span>
        <button data-b="regular" aria-pressed="true">ceny wyjściowej</button>
        <button data-b="low30" aria-pressed="false">najniższej z 30 dni</button>
      </div>
      <select id="sort" aria-label="Sortowanie">
        <option value="discount">Największy rabat</option>
        <option value="new">Najnowsze</option>
        <option value="price">Najtańsze</option>
        <option value="saving">Największa oszczędność</option>
      </select>
    </div>
    <div class="note" id="note"></div>
    <div class="note" id="sizeNote"></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden>Pokaż więcej</button>
  </main>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let favs = new Set(store.get('favs', []));
let showUnknown = false, shop = 'Wszystkie', limit = 60, kind = '', sex = '', best = false, allShops = false, sc = {};
const zl = n => n.toFixed(2).replace('.', ',') + ' zł';
const realOff = d => d.real_discount30 != null ? d.real_discount30 : d.discount;
let base = 'regular';
// rabat według wybranej podstawy; gdy sklep nie podaje ceny z 30 dni – liczony od ceny wyjściowej
const has30 = d => d.lowest30 != null && d.real_discount30 != null;
const off = d => base === 'low30' && has30(d) ? Math.max(0, d.real_discount30) : d.discount;
const isSus = d => d.was_cheaper || (d.lowest30 && d.lowest30 < d.regular - 0.01 && realOff(d) < d.discount - 5);
const isNew = d => Date.now() - new Date(d.sale_since) < 864e5;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 6e4);
  if (m < 60) return m + ' min temu';
  if (m < 1440) return Math.round(m / 60) + ' godz. temu';
  return new Date(iso).toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'short' });
}

function init() {
  if (!DATA) { $('grid').innerHTML = '<div class="empty">Brak danych — robot jeszcze nie zrobił pierwszego skanu.</div>'; return; }
  const shopNames = [...new Set(DATA.deals.map(d => d.shop))];
  const n = shopNames.length, w = n === 1 ? 'sklep' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'sklepy' : 'sklepów';
  const metaTxt = `${n} ${w} · ${DATA.deals.length} okazji · aktualizacja ${ago(DATA.updated)}`;
  $('meta').textContent = metaTxt; $('sideMeta').textContent = metaTxt;
  DATA.deals.forEach(d => sc[d.shop] = (sc[d.shop] || 0) + 1);
  shop = store.get('shop', 'Wszystkie'); if (shop !== 'Wszystkie' && !sc[shop]) shop = 'Wszystkie';
  drawShops();
  $('shops').onclick = e => { const b = e.target.closest('.it'); if (!b) return;
    if (b.dataset.more) { allShops = !allShops; drawShops(); return; }
    shop = b.dataset.s; store.set('shop', shop); drawShops(); drawCats(); closeMenu(); reset(); };
  // menu na telefonie
  $('burger').onclick = () => document.body.classList.add('menu');
  $('shade').onclick = $('closeMenu').onclick = closeMenu;
  // wyszukiwarka: w nagłówku na komputerze, pod nagłówkiem na telefonie
  const mq = matchMedia('(min-width: 900px)');
  const placeQ = () => mq.matches ? $('meta').before($('q')) : $('qMobBox').append($('q'));
  placeQ(); mq.addEventListener ? mq.addEventListener('change', placeQ) : mq.addListener(placeQ);
  drawCats();
  // trzy niezależne filtry – łączą się ze sobą (np. Odzież + Kobieta)
  $('kinds').onclick = e => { const b = e.target.closest('.it'); if (!b) return; kind = b.dataset.k; drawCats(); reset(); };
  $('sexes').onclick = e => { const b = e.target.closest('.it'); if (!b) return; sex = b.dataset.x; drawCats(); reset(); };
  $('bestBox').onclick = e => { if (!e.target.closest('.it')) return; best = !best; drawCats(); reset(); };
  const saved = store.get('filters', {});
  base = store.get('base', saved.sort === 'real' ? 'low30' : 'regular');
  if (saved.sort === 'real') saved.sort = 'discount';
  const paintBase = () => $('base').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.b === base));
  paintBase();
  $('base').onclick = e => { const b = e.target.closest('button'); if (!b) return; base = b.dataset.b; store.set('base', base); paintBase(); reset(); };
  ['sort', 'minOff', 'minPrice', 'maxPrice', 'size'].forEach(k => { if (saved[k] != null) $(k).value = saved[k]; });
  ['q', 'sort', 'minOff', 'minPrice', 'maxPrice', 'size'].forEach(k => $(k).addEventListener('input', reset));
  $('more').onclick = () => { limit += 60; render(); };
  $('sizeNote').onclick = e => { if (e.target.id === 'sizeToggle') { showUnknown = !showUnknown; reset(); } };
  $('grid').onclick = e => {
    const b = e.target.closest('.fav'); if (!b) return;
    const u = b.dataset.u; favs.has(u) ? favs.delete(u) : favs.add(u);
    store.set('favs', [...favs]); b.setAttribute('aria-pressed', favs.has(u)); b.textContent = favs.has(u) ? '♥' : '♡';
  };
  render();
}

const SEX = ['Kobieta', 'Mężczyzna'];
const inC = (d, c) => d.category === c || (d.also || []).includes(c);
const noSize = d => !d.sizes || !d.sizes.length;
const isHome = d => inC(d, 'Dom');
const KINDS = { clothes: d => !d.shoes && !isHome(d), shoes: d => d.shoes && !isHome(d), home: isHome };
const okKind = (d, k = kind) => !k || KINDS[k](d);
const okSex = (d, x = sex) => !x || inC(d, x);
const okBest = d => !best || d.best;
const inCat = d => okKind(d) && okSex(d) && okBest(d);

function closeMenu() { document.body.classList.remove('menu'); }

// sklepy alfabetycznie; na długiej liście pokazujemy 10 pierwszych + „Pokaż wszystkie”
function drawShops() {
  const names = Object.keys(sc).sort((a, b) => a.localeCompare(b, 'pl'));
  const short = !allShops && names.length > 12 && names.indexOf(shop) < 10;
  const shown = short ? names.slice(0, 10) : names;
  $('shops').innerHTML = ['Wszystkie', ...shown].map(c =>
    `<button class="it" data-s="${esc(c)}" aria-pressed="${c === shop}">${esc(c)}<span class="n">${c === 'Wszystkie' ? DATA.deals.length : sc[c]}</span></button>`).join('')
    + (names.length > 12 ? `<button class="it toggle" data-more="1">${short ? `Pokaż wszystkie (${names.length})` : 'Zwiń listę'}</button>` : '');
}

// liczba przy każdej opcji = ile produktów zostanie po jej wybraniu (przy pozostałych filtrach bez zmian)
function drawCats() {
  const mine = DATA.deals.filter(d => shop === 'Wszystkie' || d.shop === shop);
  const item = (attr, v, label, n, on) => `<button class="it" ${attr}="${v}" aria-pressed="${on}">${label}<span class="n">${n}</span></button>`;
  const kOpts = [['', 'Wszystko'], ['clothes', '👕 Odzież'], ['shoes', '👟 Buty'], ['home', '🏠 Dom']];
  $('kinds').innerHTML = kOpts.map(([v, t]) => [v, t, mine.filter(d => okKind(d, v) && okSex(d) && okBest(d)).length])
    .filter(o => o[2] || o[0] === '' || o[0] === kind).map(([v, t, n]) => item('data-k', v, t, n, v === kind)).join('');
  const xOpts = [['', 'Wszyscy'], ['Kobieta', '👩 Kobieta'], ['Mężczyzna', '👨 Mężczyzna']];
  $('sexes').innerHTML = xOpts.map(([v, t]) => item('data-x', v, t, mine.filter(d => okSex(d, v) && okKind(d) && okBest(d)).length, v === sex)).join('');
  const nb = mine.filter(d => d.best && okKind(d) && okSex(d)).length;
  drawSizes();
  $('bestBox').innerHTML = nb || best ? item('data-b', 1, '🔥 Tylko bestsellery', nb, best) : '';
}

// lista rozmiarów zależy od wybranego rodzaju: odzież → S, M, L…, buty → 36, 37…
// przy „Wszystko” obie grupy osobno
const SIZE_ORDER = ['XXS','XS','S','M','L','XL','XXL','XXXL'];
function sortSizes(arr) {
  return arr.sort((a, b) => { const ia = SIZE_ORDER.indexOf(a), ib = SIZE_ORDER.indexOf(b);
    if (ia > -1 || ib > -1) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return (parseFloat(a) || 999) - (parseFloat(b) || 999) || a.localeCompare(b); });
}
function drawSizes() {
  const sel = $('size'), cur = sel.value;
  const pool = DATA.deals.filter(d => (shop === 'Wszystkie' || d.shop === shop) && okKind(d) && okSex(d) && !isHome(d));
  const sizesOf = list => sortSizes([...new Set(list.flatMap(d => d.sizes || []))].filter(x => x && x !== 'Jeden rozmiar'));
  const opts = list => list.map(x => `<option${x === cur ? ' selected' : ''}>${esc(x)}</option>`).join('');
  // do butów tylko rozmiary-liczby 15–52 (np. 38, 42.5, 41 1/3) – kapcie czy skarpety bywają opisane jako S/M
  const isShoeSize = x => { const n = parseFloat(String(x).replace(',', '.')); return n >= 15 && n <= 52; };
  const clothes = sizesOf(pool.filter(d => !d.shoes)), shoes = sizesOf(pool.filter(d => d.shoes)).filter(isShoeSize);
  sel.innerHTML = '<option value="">wszystkie</option>' + (kind === 'clothes' ? opts(clothes) : kind === 'shoes' ? opts(shoes)
    : (clothes.length ? `<optgroup label="Odzież">${opts(clothes)}</optgroup>` : '') + (shoes.length ? `<optgroup label="Buty">${opts(shoes)}</optgroup>` : ''));
  if (cur && sel.value !== cur) sel.value = '';
}

function crumb() {
  const parts = [];
  if (kind) parts.push({ clothes: 'Odzież', shoes: 'Buty', home: 'Dom' }[kind]);
  if (sex) parts.push(sex);
  if (best) parts.push('Bestsellery');
  if (shop !== 'Wszystkie') parts.push(shop);
  $('crumb').textContent = parts.length ? parts.join(' › ') : 'Wszystkie okazje';
}

function reset() {
  limit = 60;
  store.set('filters', { sort: $('sort').value, minOff: $('minOff').value, minPrice: $('minPrice').value, maxPrice: $('maxPrice').value, size: $('size').value });
  render();
}

function render() {
  const q = $('q').value.trim().toLowerCase(), minOff = +$('minOff').value, minP = parseFloat($('minPrice').value), maxP = parseFloat($('maxPrice').value), size = $('size').value;
  $('minOffV').textContent = minOff + '%';
  let list = DATA.deals.filter(d =>
    (shop === 'Wszystkie' || d.shop === shop) &&
    inCat(d) && off(d) >= minOff &&
    (!minP || d.current >= minP) && (!maxP || d.current <= maxP) && (!q || d.name.toLowerCase().includes(q)) &&
    (!size || (noSize(d) ? showUnknown : d.sizes.includes(size) || d.sizes.includes('Jeden rozmiar'))) &&
    true);
  const s = $('sort').value;
  const by = { discount: (a, b) => off(b) - off(a) || b.discount - a.discount, price: (a, b) => a.current - b.current,
    saving: (a, b) => (b.regular - b.current) - (a.regular - a.current),
    new: (a, b) => b.sale_since.localeCompare(a.sale_since) };
  list.sort(by[s]);
  // przy wybranym rozmiarze: najpierw produkty, które na pewno go mają, potem (jeśli włączone) te bez listy rozmiarów
  if (size) list = [...list.filter(d => !noSize(d)), ...list.filter(noSize)];
  const hidden = size && !showUnknown ? DATA.deals.filter(d => (shop === 'Wszystkie' || d.shop === shop) && inCat(d) && noSize(d)).length : 0;
  $('sizeNote').innerHTML = !size ? '' : showUnknown
    ? `Pokazuję też produkty ze sklepów, które nie podają rozmiarów (na końcu listy). <button class="link" id="sizeToggle">Ukryj je</button>`
    : hidden ? `Ukryto ${hidden} produktów ze sklepów, które nie podają rozmiarów na liście (np. Puma, eobuwie, Sizeer, Deichmann). <button class="link" id="sizeToggle">Pokaż je</button>` : '';
  crumb();
  $('count').textContent = `· ${list.length} produktów`;
  const no30 = base === 'low30' ? list.filter(d => !has30(d)).length : 0;
  $('note').textContent = no30 ? `* ${no30} produktów ze sklepów, które nie podają najniższej ceny z 30 dni – dla nich rabat liczony od ceny wyjściowej.` : '';
  $('grid').innerHTML = list.length ? list.slice(0, limit).map(card).join('')
    : '<div class="empty" style="grid-column:1/-1">Nic nie pasuje do filtrów.</div>';
  $('more').hidden = list.length <= limit;
}

function card(d) {
  const tags = [];
  if (d.stale) tags.push('<span class="tag t-warn" title="Sklep nie odpowiedział przy ostatnim skanie">dane z poprz. skanu</span>');
  if (isNew(d) && !d.stale) tags.push('<span class="tag t-new">NOWE</span>');
  if (d.code) tags.push(`<span class="tag t-code" title="${esc(d.code_note || '')}">Kod: ${esc(d.code)}</span>`);
  if (d.best) tags.push('<span class="tag t-best" title="Sklep oznaczył ten produkt jako bestseller">🔥 Bestseller</span>');
  if (d.price_drop) tags.push('<span class="tag t-drop">↓ dalej tanieje</span>');
  if (d.was_cheaper) tags.push(`<span class="tag t-warn" title="Robot widział już niższą cenę">było ${zl(d.min_seen)}</span>`);
  const low = !has30(d) ? ''
    : base === 'low30'
      ? (d.lowest30 < d.regular - 0.01 ? `<div class="low30">Cena wyjściowa: ${zl(d.regular)} (−${d.discount}%)</div>` : '')
      : (d.lowest30 < d.regular - 0.01 ? `<div class="low30">Najniższa z 30 dni: ${zl(d.lowest30)} → realnie −${Math.max(0, d.real_discount30)}%</div>` : '');
  const codeLine = d.code ? `<div class="low30">Cena po wpisaniu kodu w koszyku: ${esc(d.code_note || d.code)}</div>` : '';
  const chosen = $('size').value;
  const unknown = chosen && noSize(d) ? `<div class="low30">Rozmiar ${esc(chosen)}: sklep nie podaje rozmiarów na liście – sprawdź w sklepie</div>` : '';
  const sz = d.sizes && d.sizes.length && !(d.sizes.length === 1 && d.sizes[0] === 'Jeden rozmiar')
    ? `<div class="sizes">Rozmiary: ${d.sizes.map(esc).join(' · ')}</div>` : '';
  const f = favs.has(d.url);
  return `<article class="card">
    <a class="img" href="${esc(d.url)}" target="_blank" rel="noopener">
      ${d.image ? `<img src="${esc(d.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}
      <span class="off" title="${base === 'low30' ? (has30(d) ? 'Rabat od najniższej ceny z 30 dni' : 'Sklep nie podaje ceny z 30 dni – rabat od ceny wyjściowej') : 'Rabat od ceny wyjściowej'}">−${off(d)}%${base === 'low30' && !has30(d) ? '*' : ''}</span>
    </a>
    <button class="fav" data-u="${esc(d.url)}" aria-pressed="${f}" aria-label="Ulubione">${f ? '♥' : '♡'}</button>
    <div class="body">
      <div class="shop">${esc(d.shop)}</div>
      <a class="name" href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.name)}</a>
      <div class="prices"><span class="now">${zl(d.current)}</span><span class="was" title="${base === 'low30' && has30(d) ? 'Najniższa cena z 30 dni' : 'Cena wyjściowa'}">${zl(base === 'low30' && has30(d) ? d.lowest30 : d.regular)}</span></div>
      ${codeLine}
      ${low}
      ${sz}
      ${unknown}
      ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    </div>
  </article>`;
}
init();
</script>
</body>
</html>
